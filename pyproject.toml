[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["users", "books", "borrowings"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
